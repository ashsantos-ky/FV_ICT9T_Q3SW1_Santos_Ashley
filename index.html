<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Conversion</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: lightblue;
      font-family: 'sans-serif;', serif;
      color: #000000;
      text-align: center;
      padding: 20px;
    }
    h1, p {
      margin-bottom: 20px;
    }
    .highlight {
      background-color: grey;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .btn-currency {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 10px 30px;
      margin: 10px;
      border: none;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-dollar {
      background-color: lightskyblue;
    }
    .btn-yen {
      background-color: paleturquoise;
    }
    .output-box {
      background-color: #000;
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 20px;
      width: 200px;
    }
  </style>
</head>
<body>
  <h1>Click to convert</h1>
  <div class="highlight">100 Pesos</div>
  <p>to the following currencies:</p>
  <button class="btn-currency btn-dollar" onclick="convertToDollar()">Dollar</button>
  <button class="btn-currency btn-yen" onclick="convertToEuro()">Euro</button>
  <div class="output-box" id="conversionResult">--</div>

  <script>
    function convertToDollar() {
      const pesos = 100;
      const dollarRate = 0.017;
      const dollars = (pesos * dollarRate).toFixed(2);
      document.getElementById('conversionResult').innerHTML = `Dollar: ${dollars} USD`;
    }
    function convertToEuro() {
      const pesos = 100;
      const euroRate = 0.017;
      const euro = (pesos * euroRate).toFixed(2);
      document.getElementById('conversionResult').innerHTML = `Euro: ${euro} EU`;
    }
  </script>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.4.4/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
